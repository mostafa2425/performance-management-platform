name: Frontend quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: install
        run: npm install
      - name: Lint
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Typecheck
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: Tests
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm test
      - name: Production build
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run build
